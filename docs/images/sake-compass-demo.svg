  <text x="1040" y="38" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#485b50">銘柄を探す</text>
  <text x="1150" y="38" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#485b50">銘柄を登録</text>
