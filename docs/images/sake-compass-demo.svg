  <circle cx="1222" cy="200" r="127" fill="#fff" opacity=".045"/><circle cx="1280" cy="274" r="74" fill="#fff" opacity=".04"/>
  <text x="126" y="146" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#dbb97b">YOUR FIRST SAKE, MADE SIMPLE</text>
  <text x="126" y="210" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="38" font-weight="700" fill="#fffaf0">今夜の一杯を、</text>
  <text x="126" y="260" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="38" font-weight="700" fill="#fffaf0">好みから見つけよう。</text>
  <text x="128" y="300" font-family="'Yu Gothic',Meiryo,sans-serif" font-size="15" fill="#e2e8df">好きな味わいを選ぶだけ。気になる銘柄を見つけましょう。</text>
