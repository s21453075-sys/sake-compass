<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SAKE compass アプリ画面デモ</title>
  <desc id="desc">好みの味わいから日本酒を選び、銘柄を登録できるSAKE compassの画面イメージ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#eee5d7"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3c34"/><stop offset="1" stop-color="#335a49"/></linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d0ba85"/><stop offset=".45" stop-color="#f6e9c4"/><stop offset="1" stop-color="#b29862"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#263c32" flood-opacity=".09"/></filter>
  </defs>
