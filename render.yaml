services:
  - type: web
    name: sake-compass
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/sakes
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sake-compass-db
          property: connectionString

databases:
  - name: sake-compass-db
    databaseName: sake_compass
    user: sake_compass
    plan: free
    region: singapore
